services:
  schedule:
    build:
      context: .
    image: smart-schedule:latest
    container_name: smart-schedule
    restart: unless-stopped
    init: true
    ports:
      - "${SCHEDULE_HTTP_PORT:-8787}:8787"
    volumes:
      - schedule-data:/app/data
    environment:
      NODE_ENV: production
      PORT: 8787
      SCHEDULE_MODE: "${SCHEDULE_MODE:-}"
      SCHEDULE_API_FORMAT: "${SCHEDULE_API_FORMAT:-}"
      SCHEDULE_MODEL: "${SCHEDULE_MODEL:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      SCHEDULE_MAX_IMAGE_BYTES: "${SCHEDULE_MAX_IMAGE_BYTES:-10485760}"
      SCHEDULE_MAX_NOTICE_CHARS: "${SCHEDULE_MAX_NOTICE_CHARS:-4000}"
      SCHEDULE_RATE_LIMIT_PER_MINUTE: "${SCHEDULE_RATE_LIMIT_PER_MINUTE:-10}"
      SCHEDULE_MAX_CONCURRENT: "${SCHEDULE_MAX_CONCURRENT:-4}"
      SCHEDULE_UPSTREAM_TIMEOUT_MS: "${SCHEDULE_UPSTREAM_TIMEOUT_MS:-270000}"
      SCHEDULE_MAX_OUTPUT_TOKENS: "${SCHEDULE_MAX_OUTPUT_TOKENS:-8000}"
      SCHEDULE_DATA_FILE: /app/data/schedule.json

volumes:
  schedule-data:
